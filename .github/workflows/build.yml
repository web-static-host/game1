name: Тесты и сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  tests:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Импорт проекта
        run: godot --headless --path . --import
      - name: Автотесты
        run: godot --headless --path . -s res://tests/run_tests.gd

  android:
    needs: tests
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Шаблоны экспорта и настройки редактора
        run: |
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
            cp -r /root/.config/godot ~/.config/godot
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      # Версия = <основная из project.godot>.<номер сборки>, versionCode = номер сборки.
      # Чтобы поднять основную версию, поменяйте config/version в project.godot (например на "0.3.0").
      - name: Номер версии
        run: |
          BASE=$(grep '^config/version=' project.godot | sed -E 's/.*"([0-9]+\.[0-9]+).*/\1/')
          VERSION="$BASE.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i -E "s/^version\/name=.*/version\/name=\"$VERSION\"/" export_presets.cfg
          sed -i -E "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          grep -E '^version/(code|name)=' export_presets.cfg
          grep '^config/version=' project.godot
      - name: Отладочный ключ подписи
        run: keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
      - name: Сборка APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-debug "Android" build/vertikal.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: vertikal-debug-apk
          path: build/vertikal.apk
          if-no-files-found: error
      # Прямая ссылка на APK без архива:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/vertikal.apk
      - name: Публикация APK в Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Версия ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: build/vertikal.apk
          make_latest: true
          body: |
            Версия ${{ env.VERSION }} (versionCode ${{ github.run_number }}).
            Отладочная сборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.
            Скачайте `vertikal.apk` ниже и установите на Android-телефон.
